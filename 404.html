  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overscroll-behavior:none; }
  body{
    margin:0; color:var(--ink); font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;

    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  /* liquid-glass ambient backdrop */
  .ambient{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .ambient{ opacity:.55 } .ambient i{ position:absolute; display:block; border-radius:50%; filter:blur(80px); opacity:.35; }
  .ambient i:nth-child(1){ width:52vw; height:52vw; left:-12vw; top:-14vw; background:#ffd8a8; }
  .ambient i:nth-child(2){ width:46vw; height:46vw; right:-14vw; top:6vh; background:#cfd9ff; }
  .ambient i:nth-child(3){ width:60vw; height:60vw; left:8vw; bottom:-22vw; background:#ffd6e7; }
  html.dark .ambient i:nth-child(1){ background:#5a3210; opacity:.35 }
  html.dark .ambient i:nth-child(2){ background:#1e2a5a; opacity:.35 }
  html.dark .ambient i:nth-child(3){ background:#4a1e33; opacity:.3 }

  .glass{ background:var(--glass); -webkit-backdrop-filter:blur(30px) saturate(185%); backdrop-filter:blur(30px) saturate(185%); border:1px solid var(--glass-brd);

  .step .dot{ width:16px; height:16px; border-radius:50%; flex:none; display:grid; place-items:center; border:1px solid var(--line); margin-top:1px; }
  .step.done .dot{ background:#ecfdf3; border-color:#b6e7cb; color:#12804a }
  .step.run .dot{ border-color:#fdba74; color:#ea580c }

  .dock{ padding-bottom:14px; }
  @media (min-width:1181px){ .has-pv-stage:not(.is-task) .pane:not(#pvStage){ max-width:none; } }
  #main.pv-split > .pane:first-child{ padding-right:0 }

/* ============================================================
   Agent Workspace Studio — single-file app
   ============================================================ */
var APP = "N Studio";
var BRAND = "N Studio";

/* ---------- storage ---------- */
var LS = {
  get(k, d) { try { const v = localStorage.getItem("aws:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("aws:" + k, JSON.stringify(v)); } catch {} },

  route: "home",

  agents: LS.get("agents", null),
  lib: LS.get("lib", null),

  user: LS.get("user", null),
  projects: LS.get("projects", null),
  agent: LS.get("agent", "Auto"),
  voice: null,
  project: null,
};

/* ---------- utils ---------- */

function mdBlock(s = "") {

};

function draftAnswer(q) {
  const s = " " + String(q || "").toLowerCase() + " ";
  if (/\btranslate\b|\bbengali\b/.test(s)) {
    const doc = /cover letter/.test(s) ? "cover letter" : /cv|resume/.test(s) ? "CV" : "letter";
    return {
      heading: "Bengali translation of your " + doc,
      intro: "Your " + doc + " is not attached to this task yet, so here is the structure and a ready-made opening — attach the file and every line gets translated in place.",
      sections: [
        { h: "Ready-made opening", items: [
          "আমি এই পদে আবেদন করতে আগ্রহী এবং আমার অভিজ্ঞতা ও দক্ষতা এই ভূমিকার জন্য উপযুক্ত বলে আমি বিশ্বাস করি।",
          "সম্মানিত নিয়োগকর্তা, আপনার মূল্যবান সময় দেওয়ার জন্য ধন্যবাদ।",
        ] },
        { h: "How I translate it", items: [
          "Names, dates, employers and reference numbers stay in English so the embassy or employer can match them.",
          "The body is translated into formal Bengali, not transliterated.",
          "You get a side-by-side version in the preview panel before anything is printed.",
        ] },
      ],
    };
  }
  if (/\bcv\b|resume|curriculum/.test(s)) return {
    heading: "CV draft, matched to the role",
    intro: "This is the section order I use for an application-ready CV. Send your history and I will fill every line.",
    sections: [
      { h: "Sections", items: ["Name and contact block — one line, no photo required", "Profile, three lines tied to the job title", "Experience, newest first, with numbers and outcomes", "Skills and languages, including any English test score", "References or availability"] },
      { h: "Rules applied", items: ["One page under eight years of experience", "Same job title wording as the employer advert", "No unexplained gaps — a short date-range line instead"] },
    ],
  };
  if (/email|letter to|write to|employer/.test(s)) return {
    heading: "Message draft",
    intro: "A short, polite draft to send after review. Replace the bracketed parts with your details.",
    sections: [
      { h: "Draft", items: ["Subject: Application — [job title] ([reference])", "Dear [name], I am writing about the [job title] role advertised on [portal]. I have [years] of experience in [trade] and my documents are ready for verification.", "I would be glad to share my passport, qualification and experience certificates. Thank you for your time.", "Kind regards, [your name] · [phone] · [email]"] },
    ],
  };
  if (/check|review|documents/.test(s)) return {
    heading: "Document check plan",
    intro: "I will check your file set against the route you are applying for and flag anything that would cause a refusal.",
    sections: [
      { h: "What I check", items: ["Passport validity: six months beyond the intended stay", "Name spelling identical across passport, diploma and offer letter", "Qualification matching the job's ISCO/SOC code", "Employment proof: contract, experience letter, payslips", "Funds held for the required period, in a statement you can print"] },
      { h: "To start", items: ["Attach the documents with the + button in the composer.", "Or paste the job advert link and I check against its requirements."] },
    ],
  };
  return {
    heading: "Plan for this task",
    intro: "I can run this end to end. Here is the plan I would follow for: " + String(q || "").slice(0, 120),
    sections: [
      { h: "Plan", items: ["Confirm the destination route and the job title", "Collect the official requirement list and fees from the government portal", "Check your documents against that list and mark what is missing", "Render a print-ready pack in the preview panel"] },
      { h: "What I need", items: ["The destination country and job title", "Any documents you already have", "A Gemini key for live research instead of built-in cards"] },
    ],
  };
}

function newTask(title) {
  const t = { id: rid(), title, msgs: [], created: Date.now() };
  if (S.route === "task" && S.activeId) { const old = S.tasks.find((x) => x.id === S.activeId); if (old && !(old.msgs || []).some((m) => m.role === "agent")) S.tasks = S.tasks.filter((x) => x.id !== old.id); }
  S.tasks.unshift(t); saveTasks(); return t;
}
function activeTask() { return S.tasks.find((t) => t.id === S.activeId) || null; }
function setPreview(item) {
  const h = S.pv.hist.slice(0, S.pv.idx + 1);
  h.push(item);
  S.pv.hist = h.slice(-40); S.pv.idx = S.pv.hist.length - 1;
  LS.set("pvHist", S.pv.hist); LS.set("pvIdx", S.pv.idx);
}
function navPv(d) {
  S.pv.idx = Math.max(0, Math.min(S.pv.hist.length - 1, S.pv.idx + d));

}

addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); go("home"); setTimeout(() => $("#prompt")?.focus(), 60); }

});

    } else if (plan.intent === "search") {
      msg.page = searchPage(text, plan); setPreview(msg.page);
      answer = "I searched the official and licensed-agency sources and rendered the strongest results in the preview panel.";
      msg.pages = [{ title: "Search results", type: "search" }];
    } else if (plan.intent === "checklist") {
      msg.page = PAGES.checklist(plan.country || "Serbia", plan.job); setPreview(msg.page);
      answer = "Your document pack is ready in the preview panel — print it or share it with the applicant.";
      msg.pages = [{ title: "Visa pack (checklist)", type: "site" }];
    } else {
      research = gemReady()
        ? await gemResearch(text, plan)
        : (() => {
            const q = text;
            const wantDraft = /\btranslate\b|\bbengali\b|\bcv\b|resume|cover letter|\bemail\b|write to|review my|check my|draft/.test(" " + q.toLowerCase() + " ") || plan.kb === "generic";
            let r;
            if (wantDraft) {
              const a = draftAnswer(q);
              r = { title: a.heading, summary: a.intro, points: [], docs: [], fees: "", time: "", sources: [], engine: "local", generic: true, answer: a, query: q };
            } else {
              r = researchFromKB(plan.country, plan.job, q);
              if (r.generic) { r.answer = draftAnswer(q); r.query = q; }
            }
            return r;
          })();
      if (!alive()) return;
      research.country = plan.country || "Serbia";
      research.job = plan.job || "";
      research.question = text;
      if (research.generic) {
        const q2 = research.question;
        msg.page = { ...PAGES.researchCard(research), title: "Answer", slug: "answer" };
        setPreview(msg.page);
      } else {
        msg.page = PAGES.researchCard(research); setPreview(msg.page);
      }
      answer = research.generic
        ? "This one is different from the visa pack — I drafted a tailored answer in the preview panel, using what the task already knows. Connect a Gemini key for a live, researched version."
        : "Here is what I found — the research card in the preview panel has the requirements, the document checklist, fees, timing and the official links.";
      msg.pages = [{ title: (research.title.split(" — ")[0] || "Research") + " card", type: "research" }, { title: "Visa pack (checklist)", type: "site" }];
    }
    renderPreview(); startBrowserFeed();
  } catch (e) {
    if (!alive()) return;
    const m = String(e && e.message || e);
    msg.steps.forEach((s) => { if (s.state === "run") s.state = "done"; });
    msg.error = m === "NO_KEY" ? "Gemini key is missing — switched to the built-in knowledge base. Add your key in Plugins → Gemini." : m.slice(0, 200);
    if (m !== "NO_KEY" || true) {
      try {
        const fb = localPlan(text, "");
        const r = researchFromKB(fb.country, "", (activeTask()?.msgs || []).filter((m) => m.role === "user").map((m) => m.text).join(" "));
        r.question = r.query;
        if (r.generic) { r.answer = draftAnswer(r.query); }
        r.country = fb.country || "Serbia";
        setPreview(PAGES.researchCard(r));
        answer = "I could not reach Gemini, so I rendered the built-in, pre-verified result instead. " + msg.error;
        msg.pages = [{ title: "Research card (offline)", type: "research" }];
      } catch (e2) {
        answer = "The run failed: " + msg.error;
      }
    }
  }

  if (!alive()) return;
  msg.html = answer;
  msg.plan = plan ? { intent: plan.intent, country: plan.country, engine: plan.engine || msg.engine } : msg.plan;
  msg.time = Math.max(1, Math.round((Date.now() - started) / 1000)) + "s";
  S.run = null;
  LS.set("tasks", S.tasks);
  renderSidebar(); render();
}

function searchPage(q, plan) {
  const key = plan && plan.country ? pickKB(plan.country + " " + (plan.job || "")) : pickKB(q);
  const k = KB[key];
  const base = PAGES.search(q);
  const rows = k.sources.map((s, i) => `<div class="src"><div class="muted" style="font-size:11px">${esc((s.url || "").split("/")[2] || "")}</div><a href="${esc(s.url)}" target="_blank">${esc(s.title)}</a><div style="font-size:12px;color:#4a4843">${esc((k.points[i] || k.summary).replace(/\*\*/g, ""))}</div></div>`).join("");
  return { ...base, html: base.html.replace(/<h2>Sources[\s\S]*$/, "") .replace(/<\/div><p class="muted"[\s\S]*$/, "") + `<h2 style="font-size:13px;margin:20px 0 6px;color:#3a3833">Verified pages</h2><div class="card" style="padding:4px 16px">${rows}</div>` + `<p class="muted" style="margin-top:24px">Searches run through the ${plan && plan.engine === "gemini" ? "Gemini agent" : "built-in index"} · ${new Date().toLocaleDateString()}</p></div></body></html>` };
}

function paintRun(msgIdx) {
  const t = activeTask(); if (!t) return;
  if (S.route !== "task") return;
  const holder = $("#liveAgent");
  const m = t.msgs[msgIdx];
  if (!m) return;
  if (holder) holder.innerHTML = renderAgentMsg(m, true);
  const sc = $("#chatScroll"); if (sc) sc.scrollTop = sc.scrollHeight;
  if ($("#pvHead")) renderPreview();
}


function curPageFromTask(t) {
  if (!t) return null;
  for (let i = t.msgs.length - 1; i >= 0; i--) {
    const m = t.msgs[i];
    if (m.role === "agent" && m.page && m.page.html) return m.page;
  }
  return null;
}

function ensureLiveFrame() {
  if (PW.live) { PW.live.style.flex = "1"; PW.live.style.display = "block"; return PW.live; }

  PW.live.addEventListener("load", () => { const r = PW.live?.contentWindow; if (r) r.postMessage({ t: "connect" }, "*"); });
  return PW.live;
}
function pushLivePage(p) {
  if (!PW.live || !p) return;
  if (p.srcUrl && p.live) {
    PW.live.removeAttribute("srcdoc");
    if (PW.live.dataset.url !== p.srcUrl) { PW.live.dataset.url = p.srcUrl; PW.live.src = p.srcUrl; }
    return;
  }
  if (PW.live.dataset.url) { PW.live.removeAttribute("src"); delete PW.live.dataset.url; }
  PW.live.srcdoc = p.html || "";
}
function startBrowserFeed() {

var FILE_IN = null;
function browse(accept, label) {
  if (!FILE_IN) {
    FILE_IN = document.createElement("input");
    FILE_IN.type = "file"; FILE_IN.style.display = "none";
    FILE_IN.onchange = () => {
      const f = FILE_IN.files && FILE_IN.files[0];
      if (f) { S.file = f.name; toast("Attached " + f.name); render(); }
      FILE_IN.value = "";
    };
    document.body.appendChild(FILE_IN);
  }
  FILE_IN.accept = accept || "";
  FILE_IN.setAttribute("aria-label", label || "Attach file");
  FILE_IN.click();
}
function pickFile() { browse("", "Attach file"); }
function pickImage() { browse("image/*", "Attach image"); }
function pickFolder() { browse(".pdf,.doc,.docx,.jpg,.png,.txt", "Attach from folder"); }
function toggleVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast("Voice input is not supported in this browser"); return; }
  if (S.voice) { try { S.voice.stop(); } catch (e) {} S.voice = null; render(); return; }
  const r = new SR();
  r.lang = "en-US"; r.interimResults = true; r.continuous = false;
  S.voice = r;
  r.onresult = (e) => {
    let txt = "";
    for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
    const el = $("#prompt"); if (el) { el.value = txt; autoGrow(el); }
  };
  r.onerror = () => { S.voice = null; render(); toast("Could not hear you — try again"); };
  r.onend = () => { S.voice = null; render(); };
  try { r.start(); toast("Listening…"); } catch (e) { S.voice = null; }
  render();
}
function autoGrow(el) { el.style.height = "auto"; el.style.height = Math.min(el.scrollHeight, 180) + "px"; }
function newTaskGo(text) {
  const t = newTask("New task");
  S.activeId = t.id; S.route = "task";
  render();
  setTimeout(() => { const el = $("#prompt"); if (el && text) { el.value = text; submitPrompt(); } else el?.focus(); }, 40);
}
function submitPrompt() {
  const el = $("#prompt");
  const text = (el?.value || "").trim();
  if (!text || S.run) return;
  const wasHome = S.route !== "task";
  const wasId = S.activeId;
  if (wasHome) {
    const t = activeTask() || newTask(text.slice(0, 54));
    if (!activeTask()) { S.activeId = t.id; }
    t.title = t.title === "New task" ? text.slice(0, 54) : t.title;
    S.route = "task";
  }
  try { history.replaceState(null, "", "?task=" + encodeURIComponent(S.activeId)); } catch (e) {}
  render();
  if (el) el.value = "";
  startRun(text);
  if (wasId && S.tasks.some((x) => x.id === wasId && !(x.msgs || []).length)) { S.tasks = S.tasks.filter((x) => x.id !== wasId); saveTasks(); renderSidebar(); }
}
function openTask(id) {
  S.activeId = id; S.route = "task"; closeRail();
  try { history.replaceState(null, "", "?task=" + encodeURIComponent(id)); } catch (e) {}

}
function deleteTask(id) {

function hashPw(pw) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  const s = "ns:" + pw;
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 2654435761);
    h2 = Math.imul(h2 ^ c, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}

function scheduleLabel(a) {
  const t = String(a.time || "09:00");
  if (a.freq === "hourly") return "Every hour at :" + t.split(":")[1];
  if (a.freq === "daily") return "Daily at " + t;
  if (a.freq === "weekly") return ["Sundays", "Mondays", "Tuesdays", "Wednesdays", "Thursdays", "Fridays", "Saturdays"][a.dow || 1] + " at " + t;
  return "Manual only";
}
function nextRunAt(a, from) {
  const base = new Date(from || Date.now());
  base.setSeconds(0, 0);
  const [hh, mm] = String(a.time || "09:00").split(":").map(Number);
  if (a.freq === "hourly") {
    const n = new Date(base); n.setMinutes(mm || 0); if (n <= base) n.setHours(n.getHours() + 1); return n.getTime();
  }
  if (a.freq === "weekly") {
    const n = new Date(base); n.setHours(hh || 9, mm || 0, 0, 0);
    const delta = ((a.dow || 1) - n.getDay() + 7) % 7;
    n.setDate(n.getDate() + delta);
    if (n.getTime() <= base.getTime()) n.setDate(n.getDate() + 7);
    return n.getTime();
  }
  const n = new Date(base); n.setHours(hh || 9, mm || 0, 0, 0);
  if (n.getTime() <= base.getTime()) n.setDate(n.getDate() + 1);
  return n.getTime();
}
function relTime(ts) {
  const diff = ts - Date.now();
  const mins = Math.round(diff / 60000);
  if (Math.abs(mins) < 60) return (mins >= 0 ? "in " : "") + Math.abs(mins) + "m" + (mins < 0 ? " ago" : "");
  const h = Math.round(mins / 60);
  if (Math.abs(h) < 24) return (h >= 0 ? "in " : "") + Math.abs(h) + "h" + (h < 0 ? " ago" : "");
  const d = Math.round(h / 24);
  return (d >= 0 ? "in " : "") + Math.abs(d) + "d" + (d < 0 ? " ago" : "");
}

  list.forEach((a) => {

    if (!a.nextRun) { a.nextRun = nextRunAt(a, now); saveAuto(); return; }
    if (a.nextRun <= now) {

      saveAuto();
      if (S.route === "automations") render();
    }
  });
}

async function testBrowserUse() {
  const k = pluginKey("bu");
  if (!k) { openConnector("bu"); return; }
  try {
    const r = await fetch("https://api.browser-use.com/api/v4/browsers", { headers: { "X-Browser-Use-API-Key": k } });
    toast(r.ok ? "Browser Use key works" : "Browser Use rejected the key (" + r.status + ")");
  } catch (e) { toast("Could not reach Browser Use"); }
}
function exportData() {
  const dump = {
    exported: new Date().toISOString(), app: APP,
    user: S.user, tasks: S.tasks, projects: LS.get("projects", []), skills: LS.get("skills", null),
    automations: LS.get("automations", []), library: (S.lib || []).filter((l) => !l._seed), theme: S.theme, model: LS.get("geminiModel", null),
  };
  const blob = new Blob([JSON.stringify(dump, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "n-studio-export-" + new Date().toISOString().slice(0, 10) + ".json";
  a.click(); toast("Exported your data");
}
function importData() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json";
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const d = JSON.parse(String(rd.result));
        if (Array.isArray(d.tasks)) { S.tasks = d.tasks; saveTasks(); }
        if (Array.isArray(d.projects)) LS.set("projects", d.projects);
        if (Array.isArray(d.automations)) { LS.set("automations", d.automations); S.auto = d.automations; }
        if (d.skills) LS.set("skills", d.skills);
        if (d.user) { S.user = d.user; LS.set("user", d.user); }
        closeSheets(); go("home"); toast("Import complete");
      } catch (e) { toast("That file is not an N Studio export"); }
    };
    rd.readAsText(f);
  };
  inp.click();
}
function clearDeviceData() {
  openSheet(`<div style="padding:2px 2px 8px"><div style="font-size:15px;font-weight:650">Clear this device?</div>
    <p style="font-size:12.5px;color:var(--sub);line-height:1.6;margin:8px 0 12px">Removes tasks, projects, automations, skills settings, saved pages and API keys from this browser. Your download file is not affected.</p>
    <div style="display:flex;gap:6px"><button class="chip" style="flex:1;justify-content:center;height:40px;background:#b91c1c;color:#fff;border-color:#b91c1c" onclick="doClear()">Clear everything</button><button class="chip" style="flex:1;justify-content:center;height:40px" onclick="closeSheets()">Cancel</button></div></div>`);
}
function doClear() {
  try {
    Object.keys(localStorage).filter((k) => k.startsWith("aws:")).forEach((k) => localStorage.removeItem(k));
  } catch (e) {}
  closeSheets(); location.reload();
}
window.exportData = exportData;
window.importData = importData;
window.clearDeviceData = clearDeviceData;
window.doClear = doClear;
window.testGeminiKey = testGeminiKey;
window.testBrowserUse = testBrowserUse;
window.testWebSearch = testWebSearch;

function runConnector(id) {
  if (id === "gemini") return testGeminiKey();
  if (id === "search") return testWebSearch();
  if (id === "bu") return testBrowserUse();
  return openConnector(id);
}
window.runConnector = runConnector;

/* ============================================================
   Install (PWA) + boot
   ============================================================ */
var INSTALL_PROMPT = null;
addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); INSTALL_PROMPT = e; });

function isStandalone() {
  return matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
}
function isIOS() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}
function openInstall() {
  if (isStandalone()) {
    openSheet(`<div style="padding:6px 4px 12px;text-align:center"><div style="display:flex;justify-content:center;margin-bottom:8px">${mark(34)}</div>
      <div style="font-size:15px;font-weight:650">Already installed</div>
      <p style="font-size:12.5px;color:var(--sub);line-height:1.6">You are running ${BRAND} as an app. It opens full screen and keeps your tasks on this device.</p>
      <button class="chip" style="width:100%;justify-content:center;height:40px;margin-top:8px;background:#111;color:#fff;border-color:#111" onclick="closeSheets()">Nice</button></div>`);
    return;
  }
  const steps = isIOS()
    ? [["1", "Tap the Share button in Safari", "The square with an arrow pointing up, in the toolbar."], ["2", "Scroll and tap “Add to Home Screen”", "It sits below the page actions."], ["3", "Tap “Add”", BRAND + " opens full screen, like a native app."]]
    : [["1", "Open the browser menu", "Chrome: ⋮ · Edge: …"], ["2", "Choose “Install app”", "Or use the Install button below if it appears."], ["3", "Confirm", BRAND + " gets its own window and icon."]];
  openSheet(`<div style="padding:2px 2px 12px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">${mark(34)}
      <div><div style="font-size:15px;font-weight:650">Install ${BRAND}</div><div style="font-size:12px;color:var(--sub)">Full screen · offline friendly · home-screen icon</div></div></div>
    ${steps.map(([n, t, d]) => `<div style="display:flex;gap:11px;padding:10px 0;border-top:1px solid var(--line-2)">
      <div style="width:22px;height:22px;border-radius:50%;background:var(--hover);display:grid;place-items:center;font-size:11px;font-weight:600;flex:none">${n}</div>
      <div><div style="font-size:13px;font-weight:600">${t}</div><div style="font-size:12px;color:var(--sub);line-height:1.5">${d}</div></div></div>`).join("")}
    ${INSTALL_PROMPT ? `<button class="chip" style="width:100%;justify-content:center;height:42px;margin-top:10px;background:#111;color:#fff;border-color:#111" onclick="doInstall()">Install now</button>` : ""}
    <button class="chip" style="width:100%;justify-content:center;height:38px;margin-top:8px" onclick="closeSheets()">Close</button>
    <p style="font-size:11px;color:var(--faint);text-align:center;margin:10px 0 0;line-height:1.5">This installs a web app from your browser — the App Store is a separate native-app process.</p>
  </div>`);
}
async function doInstall() {
  if (!INSTALL_PROMPT) return;
  INSTALL_PROMPT.prompt();
  const r = await INSTALL_PROMPT.userChoice.catch(() => null);
  INSTALL_PROMPT = null;
  closeSheets();
  if (r?.outcome === "accepted") toast("Installing…");
}

/* ---------- manifest + service worker (generated inline so it works from any folder) ---------- */
(function installPWA() {
  const icon = (size, pad) => "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 512 512">` +
    `<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1b1f"/><stop offset="1" stop-color="#0b0b0f"/></linearGradient></defs>` +
    `<rect width="512" height="512" rx="${pad ? 96 : 0}" fill="url(#g)"/>` +
    `<path d="M132 168h248M132 256h160M132 344h104" stroke="#fff" stroke-width="34" stroke-linecap="round"/>` +
    `<circle cx="372" cy="336" r="62" fill="#f97316"/></svg>`);
  const hosts = ["pages.bu.app", "bu.app", "browser-use.com", "github.io"];
  const hosted = hosts.some((h) => location.hostname === h || location.hostname.endsWith("." + h)) || location.protocol === "https:";
  const appBase = hosted && /\/N-Studio\/index\.html$/.test(location.pathname) ? "./app/" : "./";
  const manifest = {
    name: APP, short_name: "Workspace", id: "/", description: "Agent workspace with a live in-app browser, skills and connectors.",
    start_url: "./", scope: "./", display: "standalone", display_override: ["standalone", "minimal-ui"],
    orientation: "any", background_color: "#f4f4f6", theme_color: "#0b0b0f", lang: "en",
    categories: ["productivity", "business"],
    icons: hosted
      ? [
          { src: "icon-192.png", sizes: "192x192", type: "image/png", purpose: "any" },
          { src: "icon-512.png", sizes: "512x512", type: "image/png", purpose: "any" },
          { src: "icon-maskable-512.png", sizes: "512x512", type: "image/png", purpose: "maskable" },
        ]
      : [
          { src: icon(192, true), sizes: "192x192", type: "image/svg+xml", purpose: "any" },
          { src: icon(512, true), sizes: "512x512", type: "image/svg+xml", purpose: "any" },
          { src: icon(512, false), sizes: "512x512", type: "image/svg+xml", purpose: "maskable" },
        ],
    shortcuts: [
      { name: "New task", url: "./?route=home" },
      { name: "Computers", url: "./?route=computers" },
      { name: "Library", url: "./?route=library" },
    ],
  };
  const link = document.getElementById("manifest-link");
  if (link && !hosted) link.href = "data:application/manifest+json;charset=utf-8," + encodeURIComponent(JSON.stringify(manifest));
  if (link && location.protocol === "https:") link.href = appBase + "manifest.webmanifest";
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    const sw = `const C="${APP}-v1";
      self.addEventListener("install",e=>{self.skipWaiting()});
      self.addEventListener("activate",e=>{e.waitUntil(self.clients.claim())});
      self.addEventListener("fetch",e=>{ if(e.request.method!=="GET")return;
        e.respondWith(caches.open(C).then(c=>c.match(e.request).then(r=>r||fetch(e.request).then(res=>{try{c.put(e.request,res.clone())}catch{};return res}).catch(()=>r)))) });`;
    const url = location.protocol === "https:" ? appBase + "sw.js" : URL.createObjectURL(new Blob([sw], { type: "text/javascript" }));
    navigator.serviceWorker.register(url, { scope: "./" }).catch(() => {});
  }
})();


/* ---------- boot ---------- */
window.boot = function boot() {
  applyTheme();
  if (!S.lib) S.lib = LS.get("lib", []);
  const params = new URLSearchParams(location.search);
  const wanted = params.get("route") || (location.hash || "").replace("#", "");
  if (wanted && ROUTES.some((r) => r.k === wanted)) S.route = wanted;
  const tid = params.get("task");
  if (tid && S.tasks.some((t) => t.id === tid)) { S.activeId = tid; S.route = "task"; }
  if (params.get("install") === "1") setTimeout(openInstall, 600);
  if (S.tasks.length) S.activeId = S.activeId || S.tasks[0].id;
  if (!S.pv.hist.length) {
    const last = S.tasks.find((t) => (t.msgs || []).some((m) => m.role === "agent"));
    const saved = last && curPageFromTask(last);
    setPreview(saved || PAGES.welcome());
  }
  if (S.route === "task" && !S.activeId) S.route = "home";

  const firstTime = !LS.get("seen", false);
  render();
  const sp = document.getElementById("splash"); setTimeout(() => { sp?.classList.add("hide"); setTimeout(() => sp?.remove(), 450); }, 260);

  if (firstTime) { LS.set("seen", true); }
  addEventListener("resize", () => { if (S.route === "task") renderPreview(); });
  try { startAutoScheduler(); } catch (e) {}
};

try { window.boot(); } catch (e) { window.__bootError = String(e && e.message || e); }

</script>
